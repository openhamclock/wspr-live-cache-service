name: Release and Docker Image

on:
  push:
    tags:
      - '[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g., 0.1)'
        required: true
        default: '0.0'
      build_docker:
        description: 'Build and push Docker image'
        required: false
        type: boolean
        default: true

jobs:
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    if: ${{ inputs.build_docker == true || inputs.build_docker == 'true' || inputs.build_docker == null }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Multiplatform Image
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          git tag -f "$TAG"
          export TAG
          chmod +x docker/build-image.sh
          ./docker/build-image.sh -m
